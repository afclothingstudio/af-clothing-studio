<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AF Clothing Studio</title>
<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:#111;position:sticky;top:0}
.logo{font-size:28px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:30px}
.card{background:#1b1b1b;padding:15px;border-radius:12px}
.card img{width:100%;border-radius:10px}
button{background:#f5b400;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
#cart{position:fixed;right:15px;top:80px;background:#222;padding:15px;border-radius:10px;width:240px}
</style>
</head>
<body>
<header><div class="logo">AF Clothing Studio</div><div>🛒 Cart: <span id="count">0</span></div></header>

<section class="grid">
<div class="card">
<img src="https://via.placeholder.com/400x450?text=Product+1">
<h3>Happiness Oversized Tee</h3><p>₹199</p>
<select><option>S</option><option>M</option><option>L</option><option>XL</option></select><br><br>
<button onclick="add('Happiness Tee',199)">Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/400x450?text=Product+2">
<h3>Break Rules Tee</h3><p>₹199</p>
<select><option>S</option><option>M</option><option>L</option><option>XL</option></select><br><br>
<button onclick="add('Break Rules',199)">Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/400x450?text=Product+3">
<h3>Never Give Up Tee</h3><p>₹249</p>
<select><option>S</option><option>M</option><option>L</option><option>XL</option></select><br><br>
<button onclick="add('Never Give Up',249)">Add to Cart</button>
</div>
</section>

<div id="cart">
<h3>Shopping Cart</h3>
<ul id="items"></ul>
<p>Total: ₹<span id="total">0</span></p>
<a id="wa" target="_blank"><button>Buy on WhatsApp</button></a>
</div>

<script>
let c=0,t=0,msg="";
function add(n,p){
c++;t+=p;
document.getElementById("count").innerText=c;
document.getElementById("total").innerText=t;
let li=document.createElement("li");li.innerText=n+" - ₹"+p;
document.getElementById("items").appendChild(li);
msg+=n+" ₹"+p+"%0A";
document.getElementById("wa").href="https://wa.me/919999999999?text=Order:%0A"+msg+"Total ₹"+t;
}
</script>
</body></html>
