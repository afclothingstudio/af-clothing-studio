<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AF Clothing Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:28px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-size:16px;
}

nav a:hover{
color:#f5c542;
}

.hero{
height:90vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=1200');
background-size:cover;
background-position:center;
}

.hero-content h1{
font-size:60px;
margin-bottom:15px;
}

.hero-content p{
font-size:20px;
margin-bottom:25px;
}

.btn{
display:inline-block;
padding:12px 30px;
background:#f5c542;
color:black;
font-weight:bold;
text-decoration:none;
border-radius:8px;
margin:10px;
}

.btn:hover{
background:white;
}

.section-title{
text-align:center;
font-size:40px;
margin-top:70px;
margin-bottom:40px;
}

.products{
padding:0 8% 80px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.product{
background:#1c1c1c;
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.product:hover{
transform:translateY(-10px);
}

.product img{
width:100%;
height:320px;
object-fit:cover;
}

.product-info{
padding:20px;
text-align:center;
}

.price{
color:#f5c542;
font-size:22px;
font-weight:bold;
margin:10px 0;
}

.whatsapp{
display:inline-block;
background:#25D366;
color:white;
padding:10px 20px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<div class="logo">
AF Clothing Studio
</div>

<nav>
<a href="#">Home</a>
<a href="#products">Products</a>
<a href="#contact">Contact</a>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>Premium Oversized T-Shirts</h1>

<p>Wear Your Style. Own Your Confidence.</p>

<a href="https://wa.me/919696436384" class="btn">
Order Now
</a>

</div>

</section>

<h2 class="section-title" id="products">
Featured Collection
</h2>
