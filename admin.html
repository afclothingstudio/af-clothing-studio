<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Style With Anas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#FAF8F3;
    --panel:#EFEAE0;
    --gold:#C9862A;
    --gold-deep:#EFA836;
    --white:#141310;
    --muted:#6B6558;
    --line: rgba(20,19,16,0.14);
    --danger:#B3392C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--ink);
    color:var(--white);
    min-height:100vh;
  }
  .wrap{max-width:820px; margin:0 auto; padding:32px 20px 80px;}
  h1{font-family:'Anton',sans-serif; font-size:28px; text-transform:uppercase; letter-spacing:0.01em; margin-bottom:4px;}
  .sub{font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:28px;}

  /* Login */
  #loginView{max-width:360px; margin:80px auto;}
  #loginView h1{text-align:center;}
  #loginView .sub{text-align:center;}
  .field{margin-bottom:16px;}
  label{display:block; font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px;}
  input[type=text], input[type=email], input[type=password], input[type=number], textarea{
    width:100%; padding:11px 12px; background:var(--panel); border:1px solid var(--line); color:var(--white);
    font-family:'Inter',sans-serif; font-size:14px; border-radius:2px;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--gold);}
  button{
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.04em;
    cursor:pointer; border:none; padding:12px 18px; border-radius:2px; transition:.2s;
  }
  .btn-primary{background:var(--gold); color:var(--ink); width:100%;}
  .btn-primary:hover{background:var(--gold-deep);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--white);}
  .btn-outline:hover{border-color:var(--gold); color:var(--gold);}
  .btn-danger{background:transparent; border:1px solid var(--danger); color:var(--danger); padding:8px 12px; font-size:11px;}
  .btn-danger:hover{background:var(--danger); color:var(--ink);}
  #loginError{color:var(--danger); font-size:13px; margin-top:10px; font-family:'Space Mono',monospace;}

  /* App shell */
  #appView{display:none;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
  .topbar-right{display:flex; gap:10px; align-items:center;}

  /* Form panel */
  .panel{background:var(--panel); border:1px solid var(--line); padding:24px; margin-bottom:36px; border-radius:3px;}
  .panel h2{font-family:'Anton',sans-serif; font-size:18px; text-transform:uppercase; margin-bottom:18px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}
  .imgPreview{width:100%; max-width:180px; aspect-ratio:1; object-fit:cover; border:1px solid var(--line); margin-top:10px; display:none; border-radius:2px;}
  .formActions{display:flex; gap:10px; margin-top:18px;}
  #formStatus{font-family:'Space Mono',monospace; font-size:12px; margin-top:12px;}

  /* Product list */
  .prow{
    display:flex; gap:16px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .prow img{width:64px; height:64px; object-fit:cover; border-radius:2px; border:1px solid var(--line); flex-shrink:0;}
  .prow-info{flex:1; min-width:0;}
  .prow-name{font-weight:700; font-size:15px;}
  .prow-meta{font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); margin-top:2px;}
  .prow-price{font-family:'Space Mono',monospace; font-weight:700; color:var(--gold-deep); margin-left:auto; margin-right:12px; white-space:nowrap;}
  .prow-actions{display:flex; gap:8px; flex-shrink:0;}
  .prow-actions button{padding:7px 10px; font-size:11px;}
  #emptyMsg{color:var(--muted); font-family:'Space Mono',monospace; font-size:13px; text-align:center; padding:30px 0; display:none;}
</style>
</head>
<body>

<div id="loginView">
  <h1>Admin Login</h1>
  <div class="sub">STYLE WITH ANAS — PRODUCT MANAGER</div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="loginEmail" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
  </div>
  <button class="btn-primary" onclick="doLogin()">Log In</button>
  <div id="loginError"></div>
</div>

<div id="appView">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 style="margin-bottom:0;">Products</h1>
        <div class="sub" style="margin-bottom:0;">STYLE WITH ANAS — ADMIN</div>
      </div>
      <div class="topbar-right">
        <button class="btn-outline" onclick="doLogout()">Log Out</button>
      </div>
    </div>

    <div class="panel">
      <h2 id="formTitle">Add New Product</h2>
      <form id="productForm" onsubmit="return saveProduct(event)">
        <input type="hidden" id="editId" value="">
        <div class="grid2">
          <div class="field">
            <label>Product Name</label>
            <input type="text" id="fName" required>
          </div>
          <div class="field">
            <label>Price (₹)</label>
            <input type="number" id="fPrice" step="1" min="0" required>
          </div>
        </div>
        <div class="field">
          <label>Short Tag (e.g. "Oversized Fit")</label>
          <input type="text" id="fMeta">
        </div>
        <div class="field">
          <label>Available Sizes</label>
          <div id="sizeCheckboxes" style="display:flex; gap:14px; flex-wrap:wrap; padding:10px 0;">
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="S" checked style="width:auto;"> S</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="M" checked style="width:auto;"> M</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="L" checked style="width:auto;"> L</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="XL" checked style="width:auto;"> XL</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="XXL" checked style="width:auto;"> XXL</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="28" style="width:auto;"> 28</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="30" style="width:auto;"> 30</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="32" style="width:auto;"> 32</label>
            <label style="display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:13px; text-transform:none; color:var(--white);"><input type="checkbox" class="size-chk" value="34" style="width:auto;"> 34</label>
          </div>
        </div>
        <div class="field">
          <label>Product Photo</label>
          <input type="file" id="fImage" accept="image/*" onchange="previewImage(event)">
          <img id="imgPreview" class="imgPreview">
        </div>
        <div class="formActions">
          <button type="submit" class="btn-primary" id="saveBtn">Save Product</button>
          <button type="button" class="btn-outline" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Cancel Edit</button>
        </div>
        <div id="formStatus"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Current Products</h2>
      <div id="productList"></div>
      <div id="emptyMsg">No products yet. Add your first one above.</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://lleumrfpbzcuiilccinz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uiopK4spnCdqyHGk9e5UKw_YOGVGBBr";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentImageData = null; // holds base64 for new/edited image

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if(data.session){
      showApp();
    } else {
      showLogin();
    }
  }

  function showLogin(){
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('appView').style.display = 'none';
  }

  function showApp(){
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('appView').style.display = 'block';
    loadProducts();
  }

  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    errBox.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      errBox.textContent = error.message;
      return;
    }
    showApp();
  }

  async function doLogout(){
    await sb.auth.signOut();
    showLogin();
  }

  function previewImage(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxW = 700;
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        currentImageData = canvas.toDataURL('image/jpeg', 0.75);
        const preview = document.getElementById('imgPreview');
        preview.src = currentImageData;
        preview.style.display = 'block';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  let currentProducts = [];

  async function loadProducts(){
    const { data, error } = await sb.from('products').select('*').order('sort_order', { ascending: true });
    const list = document.getElementById('productList');
    const empty = document.getElementById('emptyMsg');
    list.innerHTML = '';
    if(error){
      list.innerHTML = '<div style="color:var(--danger); font-family:\'Space Mono\',monospace; font-size:13px;">' + error.message + '</div>';
      return;
    }
    currentProducts = data || [];
    if(currentProducts.length === 0){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    currentProducts.forEach(function(p){
      const row = document.createElement('div');
      row.className = 'prow';
      const imgEl = document.createElement('img');
      imgEl.src = p.image_data;
      imgEl.alt = p.name;
      const info = document.createElement('div');
      info.className = 'prow-info';
      const nameEl = document.createElement('div');
      nameEl.className = 'prow-name';
      nameEl.textContent = p.name;
      const metaEl = document.createElement('div');
      metaEl.className = 'prow-meta';
      metaEl.textContent = (p.meta || '') + '  ·  Sizes: ' + (p.sizes || 'S,M,L,XL,XXL');
      info.appendChild(nameEl);
      info.appendChild(metaEl);
      const priceEl = document.createElement('div');
      priceEl.className = 'prow-price';
      priceEl.textContent = '\u20b9' + p.price;
      const actions = document.createElement('div');
      actions.className = 'prow-actions';
      const editBtn = document.createElement('button');
      editBtn.className = 'btn-outline';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', function(){ startEdit(p.id); });
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-danger';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', function(){ deleteProduct(p.id); });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(imgEl);
      row.appendChild(info);
      row.appendChild(priceEl);
      row.appendChild(actions);
      list.appendChild(row);
    });
  }

  function startEdit(id){
    const p = currentProducts.find(function(x){ return x.id === id; });
    if(!p) return;
    document.getElementById('formTitle').textContent = 'Edit Product';
    document.getElementById('editId').value = p.id;
    document.getElementById('fName').value = p.name;
    document.getElementById('fPrice').value = p.price;
    document.getElementById('fMeta').value = p.meta || '';
    const sizesArr = (p.sizes || 'S,M,L,XL,XXL').split(',').map(function(s){ return s.trim(); });
    document.querySelectorAll('.size-chk').forEach(function(chk){
      chk.checked = sizesArr.indexOf(chk.value) !== -1;
    });
    currentImageData = p.image_data;
    const preview = document.getElementById('imgPreview');
    preview.src = p.image_data;
    preview.style.display = 'block';
    document.getElementById('saveBtn').textContent = 'Update Product';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function cancelEdit(){
    document.getElementById('formTitle').textContent = 'Add New Product';
    document.getElementById('editId').value = '';
    document.getElementById('productForm').reset();
    document.getElementById('imgPreview').style.display = 'none';
    document.getElementById('saveBtn').textContent = 'Save Product';
    document.getElementById('cancelEditBtn').style.display = 'none';
    currentImageData = null;
    document.querySelectorAll('.size-chk').forEach(function(chk){
      chk.checked = ['S','M','L','XL','XXL'].indexOf(chk.value) !== -1;
    });
  }

  async function saveProduct(e){
    e.preventDefault();
    const status = document.getElementById('formStatus');
    status.textContent = '';
    const id = document.getElementById('editId').value;
    const name = document.getElementById('fName').value.trim();
    const price = parseFloat(document.getElementById('fPrice').value);
    const meta = document.getElementById('fMeta').value.trim();

    if(!id && !currentImageData){
      status.textContent = 'Please choose a product photo.';
      status.style.color = 'var(--danger)';
      return false;
    }

    const payload = { name: name, price: price, meta: meta };
    const selectedSizes = Array.from(document.querySelectorAll('.size-chk:checked')).map(function(chk){ return chk.value; });
    payload.sizes = selectedSizes.length ? selectedSizes.join(',') : 'S,M,L,XL,XXL';
    if(currentImageData){ payload.image_data = currentImageData; }

    let error;
    if(id){
      ({ error } = await sb.from('products').update(payload).eq('id', id));
    } else {
      const { data: existing } = await sb.from('products').select('sort_order').order('sort_order', { ascending:false }).limit(1);
      payload.sort_order = existing && existing.length ? existing[0].sort_order + 1 : 0;
      ({ error } = await sb.from('products').insert(payload));
    }

    if(error){
      status.style.color = 'var(--danger)';
      status.textContent = error.message;
      return false;
    }

    status.style.color = 'var(--gold-deep)';
    status.textContent = id ? 'Product updated.' : 'Product added.';
    cancelEdit();
    loadProducts();
    return false;
  }

  async function deleteProduct(id){
    if(!confirm('Delete this product? This cannot be undone.')) return;
    const { error } = await sb.from('products').delete().eq('id', id);
    if(error){ alert(error.message); return; }
    loadProducts();
  }

  checkSession();
</script>

</body>
</html>
